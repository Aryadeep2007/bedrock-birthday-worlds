name: CI - Validate and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy moviepy pydub

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Validate .gitignore
        run: |
          # Check critical patterns exist
          patterns=("private-assets/" "private-builds/" "personal-config/" "*.mcworld" "config/birthday-*.json")
          for pattern in "${patterns[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "ERROR: .gitignore missing pattern: $pattern"
              exit 1
            fi
          done
          echo "✅ .gitignore validation passed"

      - name: Validate manifest files
        run: |
          # Resource pack manifest
          if [ -f templates/resource-pack/manifest.json ]; then
            python -c "
import json
with open('templates/resource-pack/manifest.json') as f:
    m = json.load(f)
assert m['format_version'] == 2
assert 'header' in m and 'modules' in m
assert m['header']['min_engine_version'] >= [1, 26, 60]
print('✅ Resource pack manifest valid')
"
          fi

          # Behavior pack manifest
          if [ -f templates/behavior-pack/manifest.json ]; then
            python -c "
import json
with open('templates/behavior-pack/manifest.json') as f:
    m = json.load(f)
assert m['format_version'] == 2
assert 'header' in m and 'modules' in m
assert m['header']['min_engine_version'] >= [1, 26, 60]
assert any(mod['type'] in ('script', 'data') for mod in m['modules'])
print('✅ Behavior pack manifest valid')
"
          fi

      - name: Validate JavaScript syntax
        run: |
          if [ -d templates/behavior-pack/scripts ]; then
            for f in templates/behavior-pack/scripts/*.js; do
              node --check "$f" && echo "✅ $f syntax OK" || exit 1
            done
          fi

      - name: Validate Python syntax
        run: |
          for dir in src/photo-processing src/generators src/packaging; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*.py; do
                python -m py_compile "$f" && echo "✅ $f syntax OK" || exit 1
              done
            fi
          done

      - name: Validate config schema
        run: |
          if [ -f config/birthday.json ]; then
            python -c "
import json
with open('config/birthday.json') as f:
    schema = json.load(f)
assert 'title' in schema
assert 'properties' in schema
assert 'birthdayPerson' in schema['properties']
assert 'world' in schema['properties']
print('✅ Config schema valid')
"
          fi

      - name: Check for private assets
        run: |
          # Ensure no private files are tracked
          private_dirs=("private-assets" "private-builds" "personal-config" "pics" "audio")
          for dir in "${private_dirs[@]}"; do
            if [ -d "$dir" ]; then
              files=$(git ls-files "$dir" 2>/dev/null | wc -l)
              if [ "$files" -gt 0 ]; then
                echo "ERROR: Private directory '$dir' has tracked files!"
                git ls-files "$dir"
                exit 1
              fi
            fi
          done
          echo "✅ No private assets tracked"

  test-build:
    name: Test Build Pipeline
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install pillow numpy moviepy pydub

      - name: Test photo processing (with sample images)
        run: |
          # Create test images
          mkdir -p test_photos
          python -c "
from PIL import Image
import os
for i in range(3):
    img = Image.new('RGB', (200, 200), color=(i*80, 100, 150))
    img.save(f'test_photos/test_{i}.jpg')
"

          # Run photo to pixel art
          python src/photo-processing/photo_to_pixel_art.py \
            -i test_photos \
            -o test_pixelart \
            -W 64 -H 64 \
            -p extended \
            -m 3 \
            --no-functions

          # Run photo to map art
          python src/photo-processing/photo_to_maps.py \
            -i test_photos \
            -o test_maps \
            -s 128 \
            -m 3 \
            --no-contact-sheet

          echo "✅ Photo processing works"

      - name: Test world generator
        run: |
          python src/generators/world_generator.py -o test_world_structures
          echo "✅ World generator works"

      - name: Test packaging script
        run: |
          # Create minimal world template
          mkdir -p test_world
          echo "Test World" > test_world/levelname.txt

          # Create minimal packs
          mkdir -p test_rp test_bp

          cat > test_rp/manifest.json << 'EOF'
{
  "format_version": 2,
  "header": {
    "description": "Test RP",
    "name": "Test RP",
    "uuid": "11111111-1111-1111-1111-111111111111",
    "version": [1, 0, 0],
    "min_engine_version": [1, 26, 60]
  },
  "modules": [{"description": "Test", "type": "resources", "uuid": "22222222-2222-2222-2222-222222222222", "version": [1, 0, 0]}]
}
EOF

          cat > test_bp/manifest.json << 'EOF'
{
  "format_version": 2,
  "header": {
    "description": "Test BP",
    "name": "Test BP",
    "uuid": "33333333-3333-3333-3333-333333333333",
    "version": [1, 0, 0],
    "min_engine_version": [1, 26, 60]
  },
  "modules": [{"description": "Test", "type": "script", "uuid": "44444444-4444-4444-4444-444444444444", "version": [1, 0, 0], "entry": "scripts/main.js"}],
  "dependencies": [{"module_name": "@minecraft/server", "version": "1.17.0"}]
}
EOF

          mkdir -p test_bp/scripts
          echo "// test" > test_bp/scripts/main.js

          # Test build
          python src/packaging/build_mcworld.py build \
            -o test_output.mcworld \
            -w test_world \
            -r test_rp \
            -b test_bp \
            -n "Test World"

          # Validate output
          python src/packaging/build_mcworld.py validate -f test_output.mcworld
          echo "✅ Packaging works"

  release-check:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    needs: [validate, test-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          # Check if version is mentioned in key files
          echo "Checking version references..."
          # This would be expanded based on versioning strategy

      - name: Verify documentation exists
        run: |
          required_docs=("README.md" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md" "SECURITY.md")
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "WARNING: Missing $doc"
            else
              echo "✅ Found $doc"
            fi
          done

      - name: Summary
        run: |
          echo "🎉 All CI checks passed!"
          echo "Repository is ready for release."